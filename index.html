<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ramophalatse — repos</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e4e1da;
    --text: #1c1b19;
    --text-dim: #6b6860;
    --accent: #b5502f;
    --accent-dim: #d9c9a8;
    --shadow: 0 1px 2px rgba(28,27,25,0.06), 0 8px 20px rgba(28,27,25,0.04);
    --radius: 14px;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --surface: #201f1c;
      --border: #35332e;
      --text: #f2efe9;
      --text-dim: #a29d92;
      --accent: #e08b5f;
      --accent-dim: #4a3d2c;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171614; --surface: #201f1c; --border: #35332e; --text: #f2efe9;
    --text-dim: #a29d92; --accent: #e08b5f; --accent-dim: #4a3d2c;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
  }
  :root[data-theme="light"] {
    --bg: #f7f6f3; --surface: #ffffff; --border: #e4e1da; --text: #1c1b19;
    --text-dim: #6b6860; --accent: #b5502f; --accent-dim: #d9c9a8;
    --shadow: 0 1px 2px rgba(28,27,25,0.06), 0 8px 20px rgba(28,27,25,0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  header {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 40px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--text-dim);
    font-size: 15px;
    max-width: 60ch;
    line-height: 1.5;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin: 32px 0 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="search"] {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  .sort-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
  }
  .count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-name {
    font-weight: 600;
    font-size: 15px;
    word-break: break-word;
  }
  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 100px;
    background: var(--accent-dim);
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-desc {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.45;
    min-height: 18px;
  }
  .card-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: auto;
    padding-top: 8px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-dim);
    flex-shrink: 0;
  }
  .state {
    text-align: center;
    padding: 60px 0;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
  }
  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a { color: var(--text-dim); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">ramophalatse / repos</div>
    <h1>Project directory</h1>
    <div class="sub">Live index of public repos, pulled straight from the GitHub API. Click through to the running site where one exists, otherwise the source.</div>
  </header>

  <div class="controls">
    <input type="search" id="search" placeholder="Filter by name or description…" />
    <select id="sort" class="sort-select">
      <option value="updated">Recently updated</option>
      <option value="name">Name A–Z</option>
      <option value="created">Newest first</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="grid" class="grid">
    <div class="state">loading repos…</div>
  </div>

  <footer>
    <span>github.com/ramophalatse</span>
    <span id="updated-at"></span>
  </footer>
</div>

<script>
  const USERNAME = "ramophalatse";
  const gridEl = document.getElementById("grid");
  const searchEl = document.getElementById("search");
  const sortEl = document.getElementById("sort");
  const countEl = document.getElementById("count");
  const updatedEl = document.getElementById("updated-at");

  let repos = [];

  function timeAgo(dateStr) {
    const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
    const units = [
      [31536000, "y"], [2592000, "mo"], [86400, "d"], [3600, "h"], [60, "m"]
    ];
    for (const [secs, label] of units) {
      const val = Math.floor(diff / secs);
      if (val >= 1) return `${val}${label} ago`;
    }
    return "just now";
  }

  function repoUrl(repo) {
    return repo.has_pages
      ? `https://${USERNAME}.github.io/${repo.name}/`
      : repo.html_url;
  }

  function render() {
    const query = searchEl.value.trim().toLowerCase();
    const sortBy = sortEl.value;

    let list = repos.filter(r =>
      r.name.toLowerCase().includes(query) ||
      (r.description || "").toLowerCase().includes(query)
    );

    list.sort((a, b) => {
      if (sortBy === "name") return a.name.localeCompare(b.name);
      if (sortBy === "created") return new Date(b.created_at) - new Date(a.created_at);
      return new Date(b.pushed_at) - new Date(a.pushed_at);
    });

    countEl.textContent = `${list.length} repo${list.length === 1 ? "" : "s"}`;

    if (!list.length) {
      gridEl.innerHTML = `<div class="state">no matches</div>`;
      return;
    }

    gridEl.innerHTML = list.map(r => `
      <a class="card" href="${repoUrl(r)}" target="_blank" rel="noopener">
        <div class="card-top">
          <span class="card-name">${r.name}</span>
          ${r.has_pages ? '<span class="badge">live</span>' : ''}
        </div>
        <div class="card-desc">${r.description ? escapeHtml(r.description) : "&nbsp;"}</div>
        <div class="card-meta">
          ${r.language ? `<span><span class="dot"></span></span><span>${r.language}</span>` : ""}
          <span>·</span>
          <span>updated ${timeAgo(r.pushed_at)}</span>
        </div>
      </a>
    `).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function load() {
    try {
      const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
      if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
      const data = await res.json();
      repos = data.filter(r => !r.fork);
      updatedEl.textContent = `fetched ${new Date().toLocaleString()}`;
      render();
    } catch (err) {
      gridEl.innerHTML = `<div class="state">couldn't load repos (${escapeHtml(err.message)}). <a href="https://github.com/${USERNAME}?tab=repositories">view on GitHub</a></div>`;
    }
  }

  searchEl.addEventListener("input", render);
  sortEl.addEventListener("change", render);
  load();
</script>
</body>
</html>
