<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ramophalatse — repos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f1;
    --bg-deep: #edebe5;
    --surface: #fdfcf9;
    --card: #ffffff;
    --elevated: #f1efeb;
    --text: #1f232a;
    --muted: #5f646b;
    --faint: #8b8f97;
    --accent: #059669;
    --border: rgba(20,22,28,0.10);
    --border-strong: rgba(20,22,28,0.20);
    --shadow: 0 1px 2px rgba(20,22,28,.05), 0 12px 40px -16px rgba(20,22,28,.22);
    --card-r: 18px;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --display: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0f14;
      --bg-deep: #05080c;
      --surface: #11151b;
      --card: #151a20;
      --elevated: #20262c;
      --text: #f1f4f7;
      --muted: #a1a9b1;
      --faint: #697179;
      --accent: #10b981;
      --border: rgba(255,255,255,0.085);
      --border-strong: rgba(255,255,255,0.17);
      --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 60px -24px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0f14; --bg-deep: #05080c; --surface: #11151b; --card: #151a20; --elevated: #20262c;
    --text: #f1f4f7; --muted: #a1a9b1; --faint: #697179;
    --accent: #10b981;
    --border: rgba(255,255,255,0.085); --border-strong: rgba(255,255,255,0.17);
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 24px 60px -24px rgba(0,0,0,.7);
  }
  :root[data-theme="light"] {
    --bg: #f7f6f1; --bg-deep: #edebe5; --surface: #fdfcf9; --card: #ffffff; --elevated: #f1efeb;
    --text: #1f232a; --muted: #5f646b; --faint: #8b8f97;
    --accent: #059669;
    --border: rgba(20,22,28,0.10); --border-strong: rgba(20,22,28,0.20);
    --shadow: 0 1px 2px rgba(20,22,28,.05), 0 12px 40px -16px rgba(20,22,28,.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 64px 28px 80px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 40px;
    animation: pop-in 0.5s var(--ease-overshoot) both;
  }
  .header-text {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--elevated);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .theme-toggle:hover { color: var(--text); background: var(--card); }
  .theme-toggle svg { width: 16px; height: 16px; }
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(28px, 5vw, 40px);
    letter-spacing: -0.045em;
    line-height: 1.06;
    text-wrap: balance;
  }
  .sub {
    color: var(--muted);
    font-size: 15px;
    max-width: 66ch;
    line-height: 1.6;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin: 32px 0 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="search"] {
    flex: 1;
    min-width: 200px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="search"]:focus { border-color: var(--border-strong); }
  .sort-select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
  }
  .count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--card-r);
    padding: 18px 20px;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease, transform 0.25s var(--ease-overshoot);
  }
  .card:hover {
    border-color: var(--border-strong);
    transform: translateY(-2px);
  }
  .card > * { position: relative; z-index: 1; }
  .ghost-glow {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    right: -55px;
    top: -55px;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in oklab, var(--accent) 40%, transparent), transparent 70%);
    filter: blur(8px);
  }
  .ghost-mark {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    right: -4px;
    top: -8px;
    white-space: nowrap;
    user-select: none;
    font-family: var(--display);
    font-weight: 800;
    font-style: italic;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.02em;
    opacity: 0.5;
    color: transparent;
    background-image: linear-gradient(90deg, transparent 0%, var(--faint) 80%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
    word-break: break-word;
    text-decoration: none;
    color: inherit;
  }
  .card-name:hover { color: var(--accent); }
  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
    min-height: 18px;
  }
  .card-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: auto;
    padding-top: 8px;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .pages {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .page-link {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    background: var(--elevated);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .page-link:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .page-link.disabled {
    opacity: 0.5;
    cursor: default;
    pointer-events: none;
  }
  .state {
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
  }
  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a { color: var(--muted); }
  a { color: var(--accent); }
  @media (max-width: 680px) {
    .wrap { padding: 40px 20px 60px; }
    .controls { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-text">
      <div class="eyebrow">ramophalatse / repos</div>
      <h1>Project directory</h1>
      <div class="sub">Every public repo, one page. Rendered when it's live, source when it isn't.</div>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark / light theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </header>

  <div class="controls">
    <input type="search" id="search" placeholder="Filter by name or description…" />
    <select id="sort" class="sort-select">
      <option value="updated">Recently updated</option>
      <option value="name">Name A–Z</option>
      <option value="created">Newest first</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="grid" class="grid">
    <div class="state">loading repos…</div>
  </div>

  <footer>
    <span>github.com/ramophalatse</span>
    <span id="updated-at"></span>
  </footer>
</div>

<script>
  const USERNAME = "ramophalatse";
  const gridEl = document.getElementById("grid");
  const searchEl = document.getElementById("search");
  const sortEl = document.getElementById("sort");
  const countEl = document.getElementById("count");
  const updatedEl = document.getElementById("updated-at");

  let repos = [];
  const filesByRepo = {};

  function timeAgo(dateStr) {
    const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
    const units = [
      [31536000, "y"], [2592000, "mo"], [86400, "d"], [3600, "h"], [60, "m"]
    ];
    for (const [secs, label] of units) {
      const val = Math.floor(diff / secs);
      if (val >= 1) return `${val}${label} ago`;
    }
    return "just now";
  }

  const FRESH_TTL = 30 * 60 * 1000;   // treat cache as good, skip the network call
  const STALE_TTL = 24 * 60 * 60 * 1000; // still usable as a fallback if the network call fails

  function cacheRead(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      return JSON.parse(raw); // { t, v }
    } catch { return null; }
  }

  function cacheSet(key, v) {
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), v })); } catch {}
  }

  // Fetches JSON with a cache-first strategy: fresh cache short-circuits the
  // network entirely; a failed/rate-limited fetch falls back to stale cache
  // (any age) rather than showing nothing, since the GitHub API's
  // unauthenticated rate limit (60 req/hr per IP) is easy to exhaust.
  async function fetchCached(key, url, parse) {
    const cached = cacheRead(key);
    if (cached && Date.now() - cached.t < FRESH_TTL) return cached.v;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status}`);
      const data = await res.json();
      const value = parse(data);
      cacheSet(key, value);
      return value;
    } catch (err) {
      if (cached && Date.now() - cached.t < STALE_TTL) return cached.v;
      throw err;
    }
  }

  async function fetchRepoFiles(repo) {
    try {
      return await fetchCached(
        `ghfiles:${repo.name}`,
        `https://api.github.com/repos/${USERNAME}/${repo.name}/contents`,
        data => Array.isArray(data)
          ? data.filter(f => f.type === "file" && /\.html?$/i.test(f.name)).map(f => f.name)
          : []
      );
    } catch {
      return [];
    }
  }

  function pageUrlFor(repo, filename) {
    return repo.has_pages
      ? `https://${USERNAME}.github.io/${repo.name}/${filename}`
      : null;
  }

  function repoRootUrl(repo, files) {
    if (repo.has_pages && files.includes("index.html")) {
      return `https://${USERNAME}.github.io/${repo.name}/`;
    }
    return repo.html_url;
  }

  function render() {
    const query = searchEl.value.trim().toLowerCase();
    const sortBy = sortEl.value;

    let list = repos.filter(r =>
      r.name.toLowerCase().includes(query) ||
      (r.description || "").toLowerCase().includes(query)
    );

    list.sort((a, b) => {
      if (sortBy === "name") return a.name.localeCompare(b.name);
      if (sortBy === "created") return new Date(b.created_at) - new Date(a.created_at);
      return new Date(b.pushed_at) - new Date(a.pushed_at);
    });

    countEl.textContent = `${list.length} repo${list.length === 1 ? "" : "s"}`;

    if (!list.length) {
      gridEl.innerHTML = `<div class="state">no matches</div>`;
      return;
    }

    gridEl.innerHTML = list.map(r => {
      const files = filesByRepo[r.name] || [];
      const otherFiles = files.filter(f => f.toLowerCase() !== "index.html");
      const rootUrl = repoRootUrl(r, files);

      const chips = otherFiles.map(f => {
        const url = pageUrlFor(r, f);
        const label = escapeHtml(f.replace(/\.html?$/i, ""));
        return url
          ? `<a class="page-link" href="${url}" target="_blank" rel="noopener">${label}</a>`
          : `<span class="page-link disabled" title="Pages not enabled for this repo">${label}</span>`;
      }).join("");

      return `
        <div class="card">
          <div class="ghost-glow"></div>
          <span class="ghost-mark">${escapeHtml(r.name)}</span>
          <div class="card-top">
            <a class="card-name" href="${rootUrl}" target="_blank" rel="noopener">${r.name}</a>
            ${r.has_pages ? '<span class="badge">live</span>' : ''}
          </div>
          <div class="card-desc">${r.description ? escapeHtml(r.description) : "&nbsp;"}</div>
          <div class="card-meta">
            ${r.language ? `<span><span class="dot"></span></span><span>${r.language}</span>` : ""}
            <span>·</span>
            <span>updated ${timeAgo(r.pushed_at)}</span>
          </div>
          ${chips ? `<div class="pages">${chips}</div>` : ""}
        </div>
      `;
    }).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function load() {
    try {
      repos = await fetchCached(
        "ghrepos",
        `https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`,
        data => data.filter(r => !r.fork)
      );
      updatedEl.textContent = `fetched ${new Date().toLocaleString()}`;
      render();

      await Promise.all(repos.map(async r => {
        filesByRepo[r.name] = await fetchRepoFiles(r);
      }));
      render();
    } catch (err) {
      const rateLimited = String(err.message) === "403";
      const msg = rateLimited
        ? "GitHub's API rate limit was hit, try again in a few minutes"
        : `couldn't load repos (${escapeHtml(err.message)})`;
      gridEl.innerHTML = `<div class="state">${msg}. <a href="https://github.com/${USERNAME}?tab=repositories">view on GitHub</a></div>`;
    }
  }

  searchEl.addEventListener("input", render);
  sortEl.addEventListener("change", render);
  load();

  (function () {
    var THEME_KEY = "ramo-theme";
    var root = document.documentElement;
    var toggle = document.getElementById("theme-toggle");

    function preferredTheme() {
      var stored = localStorage.getItem(THEME_KEY);
      if (stored === "light" || stored === "dark") return stored;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function applyTheme(theme) {
      root.setAttribute("data-theme", theme);
      localStorage.setItem(THEME_KEY, theme);
      toggle.setAttribute("aria-pressed", theme === "dark");
    }
    applyTheme(preferredTheme());
    toggle.addEventListener("click", function () {
      applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
  })();
</script>
</body>
</html>
